<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hawar International School · Student Affairs Dashboards</title>
<link rel="stylesheet" href="style.css?v=10">
</head><body>
<section id="login" class="loginwrap" hidden>
  <div class="loginhero">
    <div class="logo">✓</div>
    <h2>Hawar International School</h2>
    <p>Middle School Student Affairs</p>
    <ul><li>Attendance register and analysis</li><li>Behavior &amp; discipline tracking</li><li>Secure, role-based access</li></ul>
  </div>
  <form id="loginForm" class="card" autocomplete="on">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to open your dashboards.</p>
    <label>Email<input id="u" name="email" type="email" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" id="loginBtn">Sign in</button>
    <p id="loginErr" role="alert" class="err"></p>
  </form>
</section>
<div id="app" class="shell" hidden>
  <aside>
    <div class="brand"><span class="logo sm">✓</span><div><strong>Hawar International School</strong><small>Middle School Student Affairs</small></div></div>
    <nav id="tabs" aria-label="Dashboards"></nav>
    <div class="user"><div><small>Signed in as</small><strong id="who"></strong><small id="role"></small></div><button id="logout">Sign out</button></div>
  </aside>
  <main>
    <section id="home" class="homepane" hidden></section>
    <iframe id="frame-attendance" class="dframe" title="Attendance" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals allow-forms" hidden></iframe>
    <iframe id="frame-discipline" class="dframe" title="Behavior and Discipline" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals allow-forms" hidden></iframe>
    <iframe id="frame-referrals" class="dframe" title="Counselor Referrals" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals allow-forms" hidden></iframe>
    <iframe id="frame-followups" class="dframe" title="Follow-Ups" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals allow-forms allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write" hidden></iframe>
    <section id="admin" class="adminpane" hidden></section>
  </main>
</div>
<script src="config.js"></script>
<script src="fb.bundle.js"></script>
<script src="app.js?v=16"></script>
</body></html>
