<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teacher Form · Hawar International School</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172d29;background:#eef4f0;--green:#126251;--dark:#103b33;--line:#dde7e1;--muted:#526962}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:18px 14px 50px}
.wrap{width:min(640px,100%)}
.head{background:radial-gradient(ellipse at 10% 35%,#286e5e 0%,transparent 60%),#12473d;color:#fff;border-radius:20px 20px 0 0;padding:24px 24px 20px}
.head small{opacity:.8;font-weight:600}.head h1{margin:.25rem 0 .2rem;font-size:1.55rem}.head p{margin:0;opacity:.85}
.card{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:22px 24px 26px;display:grid;gap:14px}
label{display:block;font-weight:600;font-size:.92rem}label>input,label>select,label>textarea{display:block;margin-top:6px;font-weight:400}label i{color:#b4561b;font-style:normal}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{border:1px solid #b9cfc5;border-radius:11px;padding:.65rem .75rem;background:#fff;width:100%;min-height:2.8rem}textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #2fa58a;outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:.85rem 1.2rem;cursor:pointer;font-size:1.02rem}.btn:hover{background:#0e5244}.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--green);border:1px solid #b9cfc5}
.err{color:#9a2630;margin:0}.note{color:var(--muted);font-size:.86rem;margin:0}
.ok{text-align:center;padding:14px 0}.ok .tick{width:64px;height:64px;border-radius:50%;background:#e1f3e7;color:#1d6a3a;display:grid;place-items:center;font-size:2rem;margin:0 auto 10px}
#f{display:grid;gap:14px}.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.who{background:#ecf5ef;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;font-size:1.05rem}fieldset.rate{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:grid;gap:8px}fieldset.rate legend{font-weight:600;font-size:.92rem;padding:0 6px}.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.opt{display:block;position:relative}.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;min-height:0}.opt span{display:block;text-align:center;border:1px solid #b9cfc5;border-radius:10px;padding:.55rem .2rem;font-size:.85rem;font-weight:600;background:#fff}.opt input:checked+span{color:#fff;border-color:transparent}.opt input:checked+.o-Excellent{background:#1d8a4a}.opt input:checked+.o-Good{background:#5fa83a}.opt input:checked+.o-Acceptable{background:#d49a14}.opt input:checked+.o-Weak{background:#c0392b}label.chk{display:flex;gap:8px;align-items:center;font-weight:400}label.chk input{width:auto;min-height:0}
[hidden]{display:none!important}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.head h1{font-size:1.3rem}}
</style></head><body><div class="wrap">
<div class="head"><small>Hawar International School · Middle School Boys</small><h1 id="title">Teacher form</h1><p id="sub">Your answer is saved directly to the school record. No sign-in needed.</p></div>
<div class="card" id="card"><p class="note">Loading…</p></div>
</div>
<script src="config.js?v=24"></script><script src="fb.bundle.js?v=24"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GRADES='6B 6M 6S 6Y 6G 6R 7B 7M 7S 7Y 7G 7R 8B 8M 8S 8Y 8G 8R 8L 9B 9M 9S 9Y 9G 9R 10B 10M 10S 10Y 10G 10R 10L 11B 11S 11Y 11IB 11L 12B 12S 12Y 12IB 12R 12L'.split(' ');
const SUBJECTS=['A.S.S','Arabic','Art','English','Global','ICT','Islamic','Life Skills','Math','PE','Sci.'];
const REASONS=['Medical Certificate','Illness - No Medical Report','Hospitalization','Family Emergency','Death in the family','Travel (pre-approved)','School Activity','Official Appointment','No valid reason','Administrative Approval'];
const CONTACT=['Mother','Father','Guardian'],METHODS=['Phone call','WhatsApp','In-person meeting','Email','Other'],MODELS=['Mainstream','ESU'];
const q=new URLSearchParams(location.search);const type=['resit','parent','obs','blue'].includes(q.get('t'))?q.get('t'):'',key=q.get('k')||'',stu=(q.get('s')||'').slice(0,120),stuG=(q.get('g')||'').slice(0,6);
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bahrain'}).format(new Date());
const sel=(n,l,req)=>'<select name="'+n+'"'+(req?' required':'')+'><option value="">Select…</option>'+l.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';
const R='<i>*</i>';
function show(){
  if(!key){$('card').innerHTML='<p class="err">This link is incomplete. Please ask the school supervisor for the correct link.</p>';return;}
  if(!type){$('card').innerHTML='<p class="note">What would you like to record?</p><a class="btn" style="text-align:center;text-decoration:none" href="?t=parent&k='+encodeURIComponent(key)+'">Parent contact</a><a class="btn ghost" style="text-align:center;text-decoration:none" href="?t=resit&k='+encodeURIComponent(key)+'">Re-sit / make-up exam request</a>';return;}
  $('title').textContent={parent:'Parent contact log',resit:'Re-sit / make-up exam request',obs:'Daily student observation',blue:'Blue report – student violation'}[type];
  if(type==='obs'||type==='blue'){showReport();return;}
  const common='<label>Your name '+R+'<input name="teacher" required maxlength="80" autocomplete="name" placeholder="e.g. Mr. Ahmed"></label>'+
   '<label>Student full name '+R+'<input name="student" required maxlength="120" autocomplete="off" placeholder="Student name as in the school list"></label>'+
   '<div class="grid2"><label>Class '+R+sel('grade',GRADES,true)+'</label><label>Model of teaching'+sel('model',MODELS,false).replace('<option value="">Select…</option>','')+'</label></div>';
  const body=type==='parent'?
   common+'<div class="grid2"><label>Date '+R+'<input type="date" name="date" required value="'+today()+'"></label><label>Who was contacted '+R+sel('contact',CONTACT,true)+'</label></div>'+
   '<label>Communication method '+R+sel('method',METHODS,true)+'</label>'+
   '<label>Reason for contact '+R+'<textarea name="reason" required maxlength="1000"></textarea></label>'+
   '<label>Outcome and agreed action<textarea name="outcome" maxlength="1000"></textarea></label>':
   common+'<div class="grid2"><label>Subject '+R+sel('subject',SUBJECTS,true)+'</label><label>Date of the exam '+R+'<input type="date" name="date" required value="'+today()+'"></label></div>'+
   '<label>Your email '+R+'<input type="email" name="teacherEmail" required maxlength="100" autocomplete="email" placeholder="name@example.com"></label><p class="note">The supervisor will add the reason and approve or reject the request. You will get the decision by email.</p>';
  $('card').innerHTML='<form id="f" autocomplete="off">'+body+'<div class="hp" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="err" id="err"></p><button class="btn" id="send">Submit</button><p class="note">Fields marked * are required.</p></form>';
  $('f').addEventListener('submit',async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    if(fd.get('website')){done();return;}
    const rec={type,key};
    for(const [k,v] of fd.entries()){if(k!=='website')rec[k]=String(v).trim();}
    rec.student=rec.student.toUpperCase();if(rec.teacherEmail)rec.teacherEmail=rec.teacherEmail.toLowerCase();
    if(!rec.model)rec.model='Mainstream';
    if(type==='resit'){rec.approval='Pending';rec.makeup='No';}
    $('send').disabled=true;$('err').textContent='';
    try{await FB.ready;await FB.submitPublic(rec);done();}
    catch(x){$('err').textContent=/permission/.test(x.code||'')?'This form is closed or the link is no longer valid. Please ask the supervisor.':'Could not send ('+(x.code||x.message)+'). Check your connection and try again.';$('send').disabled=false;}
  });
}

let BL=null;const PERIODS=['1','2','3','4','5','6'],RATE=['Excellent','Good','Acceptable','Weak'];
const CRIT=[['r1','Coming to class on time'],['r2','Following the class instructions'],['r3','Respect the teachers and students'],['r4','Behaviour in the class'],['r5','Completed classwork']];
async function showReport(){
  const common='<label>Your name '+R+'<input name="teacher" required maxlength="80" autocomplete="name" placeholder="e.g. Mr. Ahmed"></label>';
  let body;
  if(type==='obs'){
    if(!stu){$('card').innerHTML='<p class="err">This link is incomplete. Please ask the school supervisor for the correct link.</p>';return;}
    $('sub').textContent='Observation of '+stu+(stuG?' ('+stuG+')':'');
    body='<div class="who"><strong>'+esc(stu)+'</strong>'+(stuG?' <span class="note">· '+esc(stuG)+'</span>':'')+'</div>'+common+
     '<div class="grid2"><label>Date '+R+'<input type="date" name="date" required value="'+today()+'"></label><label>Period '+R+sel('period',PERIODS,true)+'</label></div>'+
     '<label>Subject'+sel('subject',SUBJECTS,false)+'</label>'+
     CRIT.map(([k,l],i)=>'<fieldset class="rate"><legend>'+l+(k==='r1'?' (mention the time below)':'')+'</legend><div class="opts">'+RATE.map(o=>'<label class="opt"><input type="radio" name="'+k+'" value="'+o+'"><span class="o-'+o+'">'+o+'</span></label>').join('')+'</div>'+(k==='r1'?'<input name="time" maxlength="20" placeholder="Time arrived, e.g. 8:07">':'')+'</fieldset>').join('')+
     '<label>Teacher notes<textarea name="notes" maxlength="1000"></textarea></label>';
  }else{
    $('sub').textContent='Report a student violation to the supervisor.';
    let L=null;try{await FB.ready;L=await FB.loadFormLink(key);}catch(e){}
    if(!L||L.type!=='blue'||!L.active||!L.roster||!L.teachers){$('card').innerHTML='<p class="err">This form is closed or the link is no longer valid. Please ask the supervisor.</p>';return;}
    BL=L;const cls=Object.keys(L.roster).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}));
    body='<label>Your name '+R+sel('teacher',L.teachers,true)+'</label>'+
     '<div class="grid2"><label>Class '+R+sel('grade',cls,true)+'</label><label>Student '+R+'<select name="student" id="stuSel" required disabled><option value="">Choose the class first</option></select></label></div>'+
     '<div class="grid2"><label>Date '+R+'<input type="date" name="date" required value="'+today()+'"></label><label>Period '+R+sel('period',PERIODS,true)+'</label></div>'+
     '<label>What happened '+R+'<textarea name="description" required maxlength="1500" placeholder="Describe the violation"></textarea></label>'+
     '<fieldset class="rate"><legend>Action taken by the teacher</legend><label class="chk"><input type="checkbox" name="actTalk" value="1"> Advised the student</label><label class="chk"><input type="checkbox" name="actParent" value="1"> Called / met the parent</label><label>Other<input name="actOther" maxlength="300" placeholder="Other action (optional)"></label></fieldset>'+
     '<p class="note">The violation number (1st, 2nd, 3rd) is set automatically by the school system from your earlier reports on this student. On the third violation the supervisor is alerted.</p>';
  }
  $('card').innerHTML='<form id="f" autocomplete="off">'+body+'<div class="hp" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="err" id="err"></p><button class="btn" id="send">Submit</button><p class="note">Fields marked * are required.</p></form>';
  if(type==='blue'){const g=$('f').elements.grade;g.onchange=()=>{const st=$('stuSel');const a=BL.roster[g.value]||[];st.innerHTML='<option value="">Select…</option>'+a.map(n=>'<option>'+esc(n)+'</option>').join('');st.disabled=!a.length;};}
  $('f').addEventListener('submit',async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    if(fd.get('website')){done();return;}
    const rec={key};
    for(const [k,v] of fd.entries()){if(k!=='website')rec[k]=String(v).trim();}
    if(type==='obs'){rec.student=stu;rec.grade=stuG;if(!CRIT.some(([k])=>rec[k])){$('err').textContent='Please tick at least one rating.';return;}}
    else{rec.vno='1';rec.student=rec.student.toUpperCase();rec.actTalk=fd.get('actTalk')==='1';rec.actParent=fd.get('actParent')==='1';}
    $('send').disabled=true;$('err').textContent='';
    try{await FB.ready;await FB.submitPublic(rec,type);done();}
    catch(x){$('err').textContent=/permission/.test(x.code||'')?'This form is closed or the link is no longer valid. Please ask the supervisor.':'Could not send ('+(x.code||x.message)+'). Check your connection and try again.';$('send').disabled=false;}
  });
}
function done(){
  $('card').innerHTML='<div class="ok"><div class="tick">✓</div><h2 style="margin:0 0 6px">Thank you!</h2><p class="note">Your entry was recorded.</p></div><button class="btn" id="again">Add another entry</button>';
  $('again').onclick=show;
}
if(!window.FB){$('card').innerHTML='<p class="err">The form could not be loaded. Please refresh the page.</p>';}else show();
</script></body></html>
