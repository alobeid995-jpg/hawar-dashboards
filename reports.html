<script>/* Shared SVG chart helpers: Viz.pie (donut + legend) and Viz.bars (vertical, grouped) */
const Viz=(()=>{
 const PAL=['#126251','#e0a526','#3f7fb8','#c24d5b','#7a5aa8','#2fa58a','#d9772b','#6b7f8c','#9ac34a','#b5517f'];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nf=new Intl.NumberFormat('en-GB',{maximumFractionDigits:1});
 if(!document.getElementById('viz-css')){const st=document.createElement('style');st.id='viz-css';st.textContent=
 '.viz-pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.viz-pie svg{width:176px;height:176px;flex:0 0 auto}'+
 '.viz-legend{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1 1 160px;min-width:0;font-size:14px}'+
 '.viz-legend li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}.viz-legend i{width:12px;height:12px;border-radius:4px;display:block}'+
 '.viz-legend span{overflow-wrap:anywhere}.viz-legend b{font-variant-numeric:tabular-nums;white-space:nowrap}.viz-legend em{font-style:normal;opacity:.65;font-weight:400}'+
 '.viz-bars{overflow-x:auto;padding-bottom:4px}.viz-bars svg{display:block;min-width:100%;height:auto}'+
 '.viz-key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 6px}.viz-key span{display:inline-flex;gap:6px;align-items:center}.viz-key i{width:11px;height:11px;border-radius:3px;display:inline-block}'+
 '.viz-empty{opacity:.7;margin:8px 0}.viz-title{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.65;margin:0 0 10px}'+
 '.viz-pair{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}@media(max-width:820px){.viz-pair{grid-template-columns:1fr}}';
 document.head.appendChild(st);}
 /* items:[{label,value,color?}] */
 function pie(items,o={}){
  items=items.filter(i=>i.value>0);
  const total=items.reduce((a,i)=>a+i.value,0);
  if(!total)return '<p class="viz-empty">No data for this selection.</p>';
  const R=62,C=2*Math.PI*R;let off=0;
  const segs=items.map((it,k)=>{
   const color=it.color||PAL[k%PAL.length],len=C*it.value/total;
   const s='<circle cx="88" cy="88" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="32" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 88 88)"><title>'+esc(it.label)+': '+nf.format(it.value)+' ('+nf.format(100*it.value/total)+'%)</title></circle>';
   off+=len;it._c=color;return s;
  }).join('');
  const center=o.center??nf.format(total);
  const svg='<svg viewBox="0 0 176 176" role="img" aria-label="Pie chart"><circle cx="88" cy="88" r="'+R+'" fill="none" stroke="#e6eee9" stroke-width="32"/>'+segs+
   '<text x="88" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">'+esc(center)+'</text><text x="88" y="106" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">'+esc(o.centerLabel||'total')+'</text></svg>';
  const legend='<ul class="viz-legend">'+items.map(it=>'<li><i style="background:'+it._c+'"></i><span>'+esc(it.label)+'</span><b>'+nf.format(it.value)+' <em>'+nf.format(100*it.value/total)+'%</em></b></li>').join('')+'</ul>';
  return '<div class="viz-pie">'+svg+legend+'</div>';
 }
 /* labels:[..]; series:[{name,color,values:[..]}]; o:{fmt,max} */
 function bars(labels,series,o={}){
  const n=labels.length;
  if(!n||!series.some(s=>s.values.some(v=>v>0)))return '<p class="viz-empty">No data for this selection.</p>';
  const fmt=o.fmt||(v=>nf.format(v));
  const max0=Math.max(...series.flatMap(s=>s.values),0);
  const top=o.max||niceMax(max0);
  let gw=Math.max(series.length*20+14,46),W=Math.max(320,n*gw+54),H=240,PL=44,PB=0,PT=22,ph=H-PB-PT;
  const rot=n>7||labels.some(l=>String(l).length>9);
  PB=rot?Math.min(14,Math.max(...labels.map(l=>String(l).length)))*5.6+26:40;ph=H-PB-PT;
  let g='';
  for(let t=0;t<=4;t++){const y=PT+ph-ph*t/4;g+='<line x1="'+PL+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#dbe6df" stroke-width="1"/><text x="'+(PL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="currentColor" opacity=".65">'+fmt(top*t/4)+'</text>';}
  const slot=(W-PL-6)/n,bw=Math.min(26,(slot-8)/series.length);
  let b='';
  labels.forEach((lab,i)=>{
   const cx=PL+slot*i+slot/2,x0=cx-bw*series.length/2;
   series.forEach((s,k)=>{
    const v=s.values[i]||0,h=ph*Math.min(v,top)/top,x=x0+k*bw,y=PT+ph-h;
    b+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+Math.max(h,v>0?2:0).toFixed(1)+'" rx="4" fill="'+s.color+'"><title>'+esc(lab)+' · '+esc(s.name)+': '+fmt(v)+'</title></rect>';
    if(series.length===1&&n<=16&&v>0)b+='<text x="'+(x+bw/2-1).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">'+fmt(v)+'</text>';
   });
   const text=String(lab),short=text.length>14?text.slice(0,13)+'…':text,ly=PT+ph+16;
   b+=rot?'<text transform="translate('+cx.toFixed(1)+' '+ly+') rotate(-38)" text-anchor="end" font-size="11" fill="currentColor"><title>'+esc(text)+'</title>'+esc(short)+'</text>':'<text x="'+cx.toFixed(1)+'" y="'+ly+'" text-anchor="middle" font-size="11" fill="currentColor">'+esc(short)+'</text>';
  });
  const key=series.length>1?'<div class="viz-key">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'';
  return key+'<div class="viz-bars"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;max-width:'+Math.round(W*1.4)+'px" role="img" aria-label="Bar chart">'+g+b+'</svg></div>';
 }
 function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
 return {pie,bars,PAL,esc};
})();
</script>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-GB');
const fmt=d=>{if(!d)return '';const x=new Date(d+'T00:00:00Z');return isNaN(x)?d:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(x);};
const fmtS=d=>{if(!d)return '';const x=new Date(d+'T00:00:00Z');return isNaN(x)?d:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}).format(x);};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bahrain'}).format(new Date());
const norm=v=>String(v||'').normalize('NFKD').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const GRADES='6B 6M 6S 6Y 6G 6R 7B 7M 7S 7Y 7G 7R 8B 8M 8S 8Y 8G 8R 8L 9B 9M 9S 9Y 9G 9R 10B 10M 10S 10Y 10G 10R 10L 11B 11S 11Y 11IB 11L 12B 12S 12Y 12IB 12R 12L'.split(' ');
const PERIODS=['1','2','3','4','5','6'];
const MS_CLASSES='6B 6M 6S 6Y 7B 7M 7S 7Y 8B 8M 8S 8Y'.split(' ');
const DEF_TEACHERS=['Mr.Mustafa','Mr.Yasser','Ms.Abhami','Ms.Malak','Mr.Benard','Ms.Cynthia','Ms.Gihan','Ms.Samia','Ms.Marwa','Mr.Yusuf Abbasi','Mr.Mousa','Mr.Mohamed Z.','Ms.Suhad','Mr.Ahmed Marhoon','Mr.Johnny','Mr.Yousef Q.','Mr.Shady','Mr.Mohamed J.','Mr.Haykal','Ms.Esra','Mr.Ahmed Alsaiah','Mr.Mosad','Ms.Khawla','Mr.Khalid M.','Mr.Raji','Ms.Michelle','Ms.Divina','Ms.April','Ms.Teena','Ms.Pamela','Ms.Alaa','Ms.Hanady','Mr.Khalid O.','Ms.Huma'];
function linkPayload(){const r={};roster.filter(x=>MS_CLASSES.includes(x.group)).forEach(x=>{(r[x.group]=r[x.group]||[]).push(String(x.name).toUpperCase());});Object.values(r).forEach(a=>a.sort());return {teachers:[...blueTeachers],roster:r};}
const sigP=p=>(p.teachers||[]).join('|')+'#'+Object.keys(p.roster||{}).sort().map(g=>g+':'+(p.roster[g]||[]).join(',')).join(';');
let syncBusy=false;
async function syncLinks(){
  if(syncBusy||!roster.length||!blueTeachers.length)return;
  const pl=linkPayload(),sg=sigP(pl),stale=links.filter(l=>l.type==='blue'&&l.active&&sigP(l)!==sg);
  if(!stale.length)return;syncBusy=true;
  try{for(const l of stale)await FB.updateFormLink(l.key,pl);}catch(e){console.error('link sync',e);}finally{syncBusy=false;}
}
function openTeachers(){
  const dlg=$('tDlg');
  $('tForm').innerHTML='<h2>Teachers list</h2><p class="muted" style="margin:0">One name per line. Teachers pick their name from this list in the Blue report form. Add or remove names any time.</p><textarea id="tTxt" rows="14" style="width:100%">'+esc(blueTeachers.join('\n'))+'</textarea><p id="tErr" class="err small" style="color:#9a2630;margin:0"></p><div class="actions"><button type="button" class="btn" id="tCancel">Cancel</button><button class="btn primary" id="tSave">Save list</button></div>';
  dlg.showModal();$('tCancel').onclick=()=>dlg.close();
  $('tForm').onsubmit=async e=>{e.preventDefault();
    const names=[...new Set($('tTxt').value.split('\n').map(x=>x.trim()).filter(Boolean))];
    if(!names.length){$('tErr').textContent='Add at least one name.';return;}
    $('tSave').disabled=true;
    try{await FB.saveBlueTeachers(names);blueTeachers=names;dlg.close();toast('Teachers list saved.');syncLinks();}
    catch(x){$('tErr').textContent='Could not save ('+(x.code||x.message)+'). Publish the latest database rules.';$('tSave').disabled=false;}
  };
}
const ORD={1:'1st',2:'2nd',3:'3rd'};
const SUP=['Warning the student','Verbal agreement','Written agreement','Informing parents by phone','After-school detention','Out-of-school detention','Discipline committee','Refer to the counsellor'];
const CRIT=[['r1','On time'],['r2','Follows instructions'],['r3','Respect'],['r4','Behaviour'],['r5','Classwork']];
const SCORE={Excellent:4,Good:3,Acceptable:2,Weak:1};
let tab='blue',blue=[],obs=[],links=[],roster=[],blueTeachers=[],linkErr='',toastT,pickedStu=null,fil={q:'',grade:'',status:'active'},canEdit=true;
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500);};
const countBy=(list,f)=>{const m={};list.forEach(r=>{const k=f(r)||'Unspecified';m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
const pie=(list,f,label)=>Viz.pie(countBy(list,f).map(([label,value])=>({label,value})),{centerLabel:label});
const bars=(list,f,name,color)=>{const e=countBy(list,f).slice(0,10);return Viz.bars(e.map(x=>x[0]),[{name,color:color||'#126251',values:e.map(x=>x[1])}]);};
const monthBars=(list,name)=>{const m={};list.forEach(r=>{const k=(r.date||'').slice(0,7);if(k)m[k]=(m[k]||0)+1;});const ks=Object.keys(m).sort();return Viz.bars(ks.map(k=>new Intl.DateTimeFormat('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}).format(new Date(k+'-01'))),[{name,color:'#126251',values:ks.map(k=>m[k])}]);};

/* ---------- shared: public links ---------- */
const base=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'form.html';
const linkUrl=l=>base()+'?t='+l.type+'&k='+encodeURIComponent(l.key)+(l.type==='obs'?'&s='+encodeURIComponent(l.student||'')+'&g='+encodeURIComponent(l.grade||''):'');
const latestLink=(type,student)=>links.filter(l=>l.type===type&&(student===undefined||norm(l.student)===norm(student))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
async function copy(text,box){try{await navigator.clipboard.writeText(text);toast('Link copied.');}catch{if(box){const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast('Select and copy the link.');}}
function drawBlueLink(){
  const box=$('linkPanel');
  if(tab!=='blue'||!canEdit){box.hidden=true;return;}
  box.hidden=false;const l=latestLink('blue');
  if(linkErr){box.innerHTML='<div class="lk"><h3>Teacher link</h3><p class="muted">Links could not be loaded ('+esc(linkErr)+'). Publish the latest database rules, then reload.</p></div>';return;}

/* ---------- Blue reports ---------- */
const ts=r=>(r.date||'')+' '+String(r.createdAt||0).padStart(15,'0');
function buildCases(){
  const m=new Map();
  blue.forEach(r=>{const k=norm(r.student)+'|'+norm(r.teacher);if(!norm(r.student))return;const c=m.get(k)||{key:k,name:r.student,teacher:r.teacher||'',grade:'',reports:[]};c.reports.push(r);if(r.grade)c.grade=r.grade;m.set(k,c);});
  return [...m.values()].map(c=>{
    c.reports.sort((a,b)=>ts(a).localeCompare(ts(b)));
    c.open=c.reports.filter(r=>!r.closedAt);c.open.forEach((r,i)=>{r._v=String(Math.min(i+1,3));});c.reports.filter(r=>r.closedAt).forEach(r=>{r._v=r.vno||'1';});
    c.max=Math.min(c.open.length,3);
    c.flag=c.open.length>=3;
    c.status=c.flag?'Needs':c.open.length?'Mon':'Closed';
    c.isNew=c.open.some(r=>r.source==='form'&&!r.reviewed);
    c.last=c.reports.reduce((a,r)=>(r.date||'')>a?r.date:a,'');
    c.teachers=[c.teacher].filter(Boolean);
    return c;
  });
}

function csvOut(name,head,lines){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+today()+'.csv';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);

function attachSuggest(input,box,onPick){

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const entryScore=r=>avg(CRIT.map(([k])=>SCORE[r[k]]).filter(Boolean));
const scoreLabel=v=>v>=3.5?'Excellent':v>=2.5?'Good':v>=1.5?'Acceptable':v>0?'Weak':'–';

  return [...m.values()].map(o=>{o.entries.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(+b.period||0)-(+a.period||0));o.avg=avg(o.entries.map(entryScore).filter(Boolean));o.last=o.entries[0]?o.entries[0].date:'';return o;}).sort((a,b)=>a.name.localeCompare(b.name));

      if(act==='view'){pickedStu=pickedStu===k?null:k;drawObs();return;}
      if(act==='copy'){await copy(linkUrl(s.link));return;}
      if(act==='pause'){await FB.setFormLinkActive(s.link.key,false);toast('Link paused.');}
      if(act==='resume'){await FB.setFormLinkActive(s.link.key,true);toast('Link is active again.');}
      if(act==='new'){if(s.link&&!confirm('Generate a new link? The current link will stop working.'))return;await FB.createFormLink('obs',links,{student:s.name,grade:s.grade});toast('New link is ready.');}
      if(act==='rm'){if(!confirm('Remove the link for '+s.name+'? Entries already received stay.'))return;await FB.deleteFormLink(s.link.key);toast('Link removed.');}
    }catch(x){toast('Could not do that ('+(x.code||x.message)+').');}
  });
  if(cur)wireDetail(cur);
}
function obsDetail(s){
  const E=s.entries;
  if(!E.length)return '<section class="panel"><h3>'+esc(s.name)+'</h3><p class="muted">No observations received yet.</p></section>';
  const byDate={};E.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(entryScore(r));});
  const ds=Object.keys(byDate).sort().slice(-14);
  const crit=CRIT.map(([k,l])=>[l,avg(E.map(r=>SCORE[r[k]]).filter(Boolean))]);
  const weak=crit.filter(c=>c[1]>0).sort((a,b)=>a[1]-b[1])[0];
  const dateChart=Viz.bars(ds.map(fmtS),[{name:'Average score (1–4)',color:'#126251',values:ds.map(d=>+avg(byDate[d].filter(Boolean)).toFixed(2))}]);
  const critChart=Viz.bars(crit.map(c=>c[0]),[{name:'Average score (1–4)',color:'#3f7fb8',values:crit.map(c=>+c[1].toFixed(2))}]);
  return '<section class="panel"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">'+esc(s.name)+' <span class="muted" style="font-weight:400">'+esc(s.grade)+'</span></h3><span class="rt rt-'+scoreLabel(s.avg)+'">'+s.avg.toFixed(1)+' · '+scoreLabel(s.avg)+'</span><span class="muted">'+E.length+' entries'+(weak?' · weakest: '+weak[0]:'')+'</span><button class="btn" id="oCsv" style="margin-left:auto">⬇ Download (Excel)</button></div><div class="charts" style="margin-top:10px"><div class="panel"><h3>Average by day (last 14 days)</h3>'+dateChart+'</div><div class="panel"><h3>Average by criterion</h3>'+critChart+'</div></div>'+
   '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Period</th><th>Teacher</th>'+CRIT.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Notes</th><th></th></tr></thead><tbody>'+E.map(r=>'<tr><td>'+fmt(r.date)+'</td><td>'+esc(r.period)+'</td><td>'+esc(r.teacher)+'<br><span class="muted">'+esc(r.subject||'')+'</span></td>'+CRIT.map(([k])=>'<td>'+(r[k]?'<span class="rt rt-'+r[k]+'">'+r[k]+'</span>':'–')+(k==='r1'&&r.time?'<br><span class="muted small">'+esc(r.time)+'</span>':'')+'</td>').join('')+'<td><div class="clamp">'+esc(r.notes||'')+'</div></td><td><button class="btn danger" data-oid="'+esc(r.id)+'" title="Delete entry">🗑</button></td></tr>').join('')+'</tbody></table></div></section>';
}
function wireDetail(s){
  if($('oCsv'))$('oCsv').onclick=()=>csvOut('observation-'+s.name.replace(/\W+/g,'-'),['Date','Period','Student','Class','Teacher','Subject','On time','Time','Follows instructions','Respect','Behaviour','Classwork','Notes'],s.entries.map(r=>[r.date,r.period,r.student,r.grade,r.teacher,r.subject,r.r1,r.time,r.r2,r.r3,r.r4,r.r5,r.notes]));
  document.querySelectorAll('[data-oid]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this observation permanently?'))return;try{await FB.deleteObservation(b.dataset.oid);obs=obs.filter(x=>x.id!==b.dataset.oid);drawObs();}catch(e){toast('Could not delete ('+(e.code||e.message)+').');}});
}

/* ---------- shell ---------- */
function draw(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('addBtn').hidden=tab!=='blue';
  drawBlueLink();
  if(tab==='blue')drawBlue();else drawObs();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw();});
$('addBtn').onclick=()=>openAdd();
(async()=>{
  try{
    await FB.ready;
    if(!FB.auth.currentUser){$('main').innerHTML='<p class="empty">Please sign in from the main page to open this dashboard.</p>';return;}
    const me=FB.profile()||{};
    if(!me.admin&&!(me.access||[]).includes('reports')){$('main').innerHTML='<p class="empty">You do not have access to this dashboard.</p>';$('addBtn').hidden=true;return;}
    FB.loadRosterNames().then(r=>{roster=r;syncLinks();}).catch(()=>{});
    FB.loadBlueTeachers().then(n=>{blueTeachers=n&&n.length?n:DEF_TEACHERS.slice();syncLinks();}).catch(()=>{blueTeachers=DEF_TEACHERS.slice();});
    const busy=()=>$('dlg').open||$('cDlg').open;
    const err=e=>{$('main').innerHTML='<p class="empty">The reports could not be loaded ('+esc(e.code||e.message)+'). If this is the first time, publish the updated database rules.</p>';};
    FB.listenFormLinks(a=>{links=a;linkErr='';syncLinks();if(!busy())draw();},e=>{linkErr=e.code||e.message;draw();});
    FB.listenBlueReports(a=>{blue=a;if(!busy())draw();},err);
    FB.listenObservations(a=>{obs=a;if(!busy())draw();},err);
    $('cDlg').addEventListener('close',()=>draw());$('dlg').addEventListener('close',()=>draw());
  }catch(e){$('main').innerHTML='<p class="empty">Could not start ('+esc(e.message||e)+').</p>';}
})();
</script></body></html>
